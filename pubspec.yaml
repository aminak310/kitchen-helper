name: kitchen_helper
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.0+2

environment:
  sdk: ^3.12.1


dependencies:
  flutter:
    sdk: flutter

  
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3


flutter:

  
  uses-material-design: true

  assets:
    - assets/images/chef_hat_logo.png
    - assets/images/veggie_bowl.png
    - assets/images/banner_food.png
    - assets/images/ing_tomato.png
    - assets/images/ing_onion.png
    - assets/images/app_launcher_icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_launcher_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_launcher_icon.png"
    background_color: "#1B5E35"
    theme_color: "#2E7D52"
  windows:
    generate: true
    image_path: "assets/images/app_launcher_icon.png"
    icon_size: 48

  
